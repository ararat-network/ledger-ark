name: Reusable build

on:
  workflow_dispatch:
  # main only: on other branches the pull_request run already covers each push.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
      - master
      - dev

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  build_application:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: "compiled_app_binaries"