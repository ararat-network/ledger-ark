name: Lint and format 💅

on:
  workflow_dispatch:
  # main only: on other branches the pull_request run already covers each push.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
      - master
      - dev

jobs:
  ledger-lint:
    uses: Zondax/_workflows/.github/workflows/_ledger_lint.yml@f66936022b77ef8373a0bd970b6251199cdf2313 # v12.4.0
    with:
      runs-on: ${{ github.repository_owner == 'zondax' && 'zondax-runners' || 'ubuntu-latest' }}
