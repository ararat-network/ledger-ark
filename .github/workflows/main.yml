name: Build

on:
  workflow_dispatch:
  # main only: on other branches the pull_request run already covers each push.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
      - master
      - dev

# CI only: release.yml cuts releases from v* tags.
permissions:
  contents: read

jobs:
  cpp_test:
    name: C++ unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.4.3
          install: true
          cache: false
          cache_save: false
          tool_versions: |
            cmake 3.28.0
          reshim: true
      - run: make cpp_test

  test_zemu:
    name: Zemu tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl protobuf-compiler build-essential git python3 python3-pip \
            libusb-1.0-0 libudev-dev
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 10
          sudo update-alternatives --install /usr/bin/pip pip /usr/bin/pip3 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # pnpm is pinned in zxlib's dockerized_build.mk; the zemu test script calls yarn.
      - run: corepack enable
      - name: Build and run zemu tests
        run: make test_all
      - name: Upload snapshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots-tmp
          path: tests_zemu/snapshots-tmp/
