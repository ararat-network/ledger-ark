name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the app version
        run: |
          . app/Makefile.version
          version="v${APPVERSION_M}.${APPVERSION_N}.${APPVERSION_P}"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi

  installers:
    name: Build installers
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Ledger's builder image, pinned by digest, and the SDK tag every device builds at.
      # The tag sets the API level, so the installers load on the firmware at that level;
      # a firmware release from Ledger moves it. Zemu stays on the Zondax image's SDK.
      BUILDER: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder-lite@sha256:3561f39cb806a22a5703d37839c32bc568e1ab2b738c8ecbf7020cfe8e857ce7
      SDK_TAG: v27.1.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # A production build: the Ark home screen, no DO NOT USE banner. The device still
      # warns that the app is unsigned until Ledger lists it. Nano X cannot sideload, so it
      # gets no installer.
      - name: Build installers
        run: .github/scripts/build_installers.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: dist/
          if-no-files-found: error

  # The ELFs Zemu loads, for testing software that talks to the app; not installers. They
  # are built and tested as main.yml's Zemu job does it, in the Zondax builder image
  # ledger-zxlib names, and collected only once the suite has passed on them. The installer
  # build's ELFs are other bytes, built at SDK_TAG in Ledger's image, and the suite does
  # not run on those.
  emulator:
    name: Build and test emulator binaries
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl protobuf-compiler build-essential git python3 python3-pip \
            libusb-1.0-0 libudev-dev
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 10
          sudo update-alternatives --install /usr/bin/pip pip /usr/bin/pip3 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # No cache is restored into a build whose output is released.
          package-manager-cache: false
      # pnpm is pinned in zxlib's dockerized_build.mk; the zemu test script calls yarn.
      - run: corepack enable
      - name: Build and run zemu tests
        run: make test_all
      - name: Upload snapshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots-tmp
          path: tests_zemu/snapshots-tmp/
      - name: Collect the emulator binaries
        run: .github/scripts/collect_emulator_binaries.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator
          path: dist/
          if-no-files-found: error

  package:
    name: Package release
    needs: [installers, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emulator
          path: dist
      # Over every file the release attaches, installers and emulator binaries alike.
      - name: Checksum the release files
        run: |
          cd dist
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
      # Each installer loads only on the firmware it was built for; the notes say which,
      # and what the emulator binaries are for.
      - name: Write the release notes
        run: |
          mkdir notes
          python3 .github/scripts/release_notes.py dist api_levels.json "$GITHUB_REF_NAME" > notes/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      # Attach every asset to a draft before publishing: immutable releases lock assets on publish.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" --generate-notes \
            --notes-file notes/notes.md
          gh release edit "$TAG" --draft=false
