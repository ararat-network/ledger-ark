name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  package:
    name: Package installers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check the tag matches the app version
        run: |
          . app/Makefile.version
          version="v${APPVERSION_M}.${APPVERSION_N}.${APPVERSION_P}"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
      # A production build: the Ark home screen, no DO NOT USE banner. The device still
      # warns that the app is unsigned until Ledger lists it.
      - name: Build installers
        run: make
      # Nano X cannot sideload, so it gets no installer.
      - name: Collect installers
        run: |
          mkdir dist
          cp app/pkg/installer_s2.sh dist/installer_nanos_plus.sh
          cp app/pkg/installer_stax.sh app/pkg/installer_flex.sh app/pkg/installer_apex_p.sh dist/
          cd dist && sha256sum installer_*.sh > SHA256SUMS
      # Each installer loads only on the firmware it was built for; the notes say which.
      - name: Write the release notes
        run: |
          mkdir notes
          python3 .github/scripts/release_notes.py dist api_levels.json "$GITHUB_REF_NAME" > notes/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      # Attach every asset to a draft before publishing: immutable releases lock assets on publish.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" --generate-notes \
            --notes-file notes/notes.md
          gh release edit "$TAG" --draft=false
