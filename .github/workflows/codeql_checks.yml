name: "CodeQL"

on:
  workflow_dispatch:
  # main only: on other branches the pull_request run already covers each push.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
      - master
      - dev
    # No path filter: the code scanning ruleset needs an analysis on every pull request.

# These must cover every scope the called workflow declares, otherwise the run is
# rejected at startup. github/codeql-action queries the workflow run, so
# reusable_codeql_checks.yml asks for actions: read.
permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyse:
    name: Call Ledger CodeQL analysis
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_codeql_checks.yml@v1
    secrets: inherit
